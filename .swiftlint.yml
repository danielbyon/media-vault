# SwiftLint 0.65.1. The exact tool version is pinned in Mintfile.
# `strict: true` promotes warning-level findings to errors. Per-rule severity is
# intentionally not repeated unless severity is part of a rule's structural configuration.

strict: true
allow_zero_lintable_files: false # default

included:
  - App
  - AppTests
  - Packages

excluded:
  - .build
  - "**/.build/**"
  - "**/.swiftpm/**"
  - "**/Generated/**"
  - "**/*.generated.swift"

only_rules:
  # Accessibility and UI correctness.
  - accessibility_label_for_image
  - accessibility_trait_for_button
  - discouraged_object_literal
  - prefer_asset_symbols
  - prohibited_interface_builder

  # Safety, correctness, and concurrency.
  - block_based_kvo
  - discarded_notification_center_observer
  - duplicate_conditions
  - duplicate_enum_cases
  - duplicated_key_in_dictionary_literal
  - fallthrough
  - fatal_error_message
  - force_cast
  - force_try
  - force_unwrapping
  - identical_operands
  - implicitly_unwrapped_optional
  - incompatible_concurrency_annotation
  - invisible_character
  - notification_center_detachment
  - nsobject_prefer_isequal
  - return_value_from_void_function
  - unavailable_condition
  - unavailable_function
  - unhandled_throwing_task
  - unowned_variable_capture
  - void_function_in_ternary
  - weak_delegate

  # Maintainability and API structure.
  - class_delegate_protocol
  - closure_body_length
  - cyclomatic_complexity
  - file_length
  - file_name
  - file_name_no_space
  - function_body_length
  - lower_acl_than_parent
  - nesting
  - non_overridable_class_declaration
  - static_over_final_class
  - type_body_length

  # Naming, documentation, and repository hygiene.
  - blanket_disable_command
  - generic_type_name
  - identifier_name
  - inclusive_language
  - invalid_swiftlint_command
  - line_length
  - local_doc_comment
  - missing_docs
  - orphaned_doc_comment
  - superfluous_disable_command
  - todo
  - type_name

  # Idiomatic modern Swift/API usage not owned by SwiftFormat.
  - function_default_parameter_at_end
  - is_disjoint
  - joined_default_parameter
  - legacy_cggeometry_functions
  - legacy_constant
  - legacy_constructor
  - legacy_hashing
  - legacy_multiple
  - legacy_nsgeometry_functions
  - legacy_objc_type
  - legacy_random
  - legacy_swiftui_aspect_ratio
  - legacy_uigraphics_function
  - non_optional_string_data_conversion
  - optional_enum_case_matching
  - prefer_self_type_over_type_of_self
  - superfluous_else
  - unneeded_escaping
  - unneeded_override
  - untyped_error_in_catch
  - unused_control_flow_label
  - unused_enumerated
  - unused_setter_value
  - variable_shadowing

analyzer_rules:
  - capture_variable
  - typesafe_array_init
  - unused_declaration
  - unused_import

blanket_disable_command:
  allowed_rules: []
  always_blanket_disable: [] # default

discouraged_object_literal:
  image_literal: true # default
  color_literal: true # default

closure_body_length:
  warning: 40
  error: 40

cyclomatic_complexity:
  warning: 10 # default
  error: 10
  ignores_case_statements: true

file_length:
  warning: 500
  error: 500
  ignore_comment_only_lines: true

file_name:
  excluded:
    - main.swift # default
    - LinuxMain.swift # default
  excluded_paths: [] # default
  prefix_pattern: "" # default
  suffix_pattern: '\+.*' # default
  nested_type_separator: "." # default
  require_fully_qualified_names: false # default

file_name_no_space:
  excluded: [] # default

force_unwrapping:
  ignored_literal_argument_functions: []

incompatible_concurrency_annotation:
  global_actors:
    - MainActor # default

invisible_character:
  additional_code_points: [] # default

function_body_length:
  warning: 60
  error: 60

function_default_parameter_at_end:
  ignore_first_isolation_inheritance_parameter: true # default

generic_type_name:
  min_length:
    warning: 1 # default
    error: 1
  max_length:
    warning: 20 # default
    error: 20
  excluded: [] # default
  allowed_symbols: [] # default

identifier_name:
  min_length:
    warning: 1
    error: 1
  max_length:
    warning: 60
    error: 60 # default upstream error threshold
  excluded: []
  allowed_symbols: [] # default
  additional_operators: [] # default

implicitly_unwrapped_optional:
  mode: all_except_iboutlets # default

inclusive_language:
  additional_terms: [] # default
  override_terms:
    - blacklist # default
    - master # default
    - slave # default
    - whitelist # default
  override_allowed_terms:
    - mastercard # default

line_length:
  warning: 140
  error: 140
  ignores_urls: true
  ignores_function_declarations: false # default
  ignores_comments: false # default
  ignores_interpolated_strings: false # default
  ignores_multiline_strings: true
  ignores_regex_literals: true
  excluded_lines_patterns: [] # default

missing_docs:
  warning:
    - open # default access level
    - public # default access level
  excludes_extensions: false
  excludes_inherited_types: false
  excludes_trivial_init: false # default
  evaluate_effective_access_control_level: true

nesting:
  type_level:
    warning: 2
    error: 2
  function_level:
    warning: 3
    error: 3
  check_nesting_in_closures_and_statements: true # default
  always_allow_one_type_in_functions: false # default
  ignore_typealiases_and_associatedtypes: false # default
  ignore_coding_keys: false # default

legacy_objc_type:
  allowed_types: [] # default

non_optional_string_data_conversion:
  include_variables: true

non_overridable_class_declaration:
  final_class_modifier: "final class" # default

type_body_length:
  warning: 300
  error: 300
  excluded_types:
    - extension # default
    - protocol # default

type_name:
  min_length:
    warning: 1
    error: 1
  max_length:
    warning: 60
    error: 60
  excluded: [] # default
  allowed_symbols: [] # default
  validate_protocols: true # default

todo:
  only:
    - TODO # default
    - FIXME # default

unneeded_override:
  affect_initializers: false # default
  excluded_methods: [] # default

unowned_variable_capture:
  allow_explicit_unsafe_unowned: false # default

unused_declaration:
  include_public_and_open: false # default
  related_usrs_to_skip: [] # default project additions; SwiftLint retains its PreviewProvider exception

unused_import:
  require_explicit_imports: true
  allowed_transitive_imports: [] # default
  always_keep_imports: [] # default

variable_shadowing:
  ignore_parameters: true # default
