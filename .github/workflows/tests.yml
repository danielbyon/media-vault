name: Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  functional-tests:
    name: ${{ matrix.name }}
    runs-on: xcode-27
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: App
            lane: app
            target: test-app
          - name: ApplicationFoundation
            lane: application-foundation
            target: test-application-foundation
          - name: iPad privacy
            lane: ipad-privacy
            target: test-ipad-privacy
          - name: Browser download UI
            lane: browser-download-ui
            target: test-browser-download-ui
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      FUNCTIONAL_LANE: ${{ matrix.lane }}
      FUNCTIONAL_TARGET: ${{ matrix.target }}
      TEST_RESULTS_DIRECTORY: .build/TestResults/${{ matrix.lane }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Record source identity
        run: |
          mkdir -p "$TEST_RESULTS_DIRECTORY"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          pull_request = event.get("pull_request") or {}
          commit = subprocess.check_output(
              ["git", "rev-list", "--parents", "-n", "1", "HEAD"], text=True
          ).strip().split()
          event_sha = os.environ["GITHUB_SHA"]
          head = pull_request.get("head") or {}
          base = pull_request.get("base") or {}
          identity = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "event_name": os.environ["GITHUB_EVENT_NAME"],
              "ref": os.environ["GITHUB_REF"],
              "event_sha": event_sha,
              "checkout_sha": commit[0],
              "checkout_parent_shas": commit[1:],
              "lane": os.environ["FUNCTIONAL_LANE"],
              "target": os.environ["FUNCTIONAL_TARGET"],
              "pull_request_number": event.get("number"),
              "pull_request_head_sha": head.get("sha"),
              "pull_request_head_ref": head.get("ref"),
              "pull_request_base_sha": base.get("sha"),
              "pull_request_base_ref": base.get("ref"),
              "source_head_sha": head.get("sha") or event_sha,
              "source_base_sha": base.get("sha"),
              "integration_sha": os.environ["GITHUB_SHA"] if pull_request else None,
          }
          output = Path(os.environ["TEST_RESULTS_DIRECTORY"]) / "source-identity.json"
          output.write_text(json.dumps(identity, indent=2, sort_keys=True) + "\n")
          if commit[0] != event_sha:
              raise SystemExit(
                  f"checkout SHA {commit[0]} does not match event SHA {event_sha}"
              )
          PY

      - name: Verify toolchain and simulator
        id: toolchain
        run: make verify-test-destination

      - name: Test clean target
        if: ${{ matrix.lane == 'app' }}
        run: make clean-test

      # Swift tooling bootstraps Mint packages under .tools/mint. Keep compiled
      # tools isolated by runner OS/architecture, exact Xcode/Swift toolchain,
      # and the swift-tooling release lock. Do not use restore-keys: a compiled
      # tool from a different toolchain must never be restored opportunistically.
      - name: Cache Mint tools
        uses: actions/cache@v6
        with:
          path: .tools/mint
          key: mint-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('Scripts/swift-tools.lock') }}

      - name: Bootstrap Swift tools
        run: make tools

      - name: Cache Swift package checkouts
        uses: actions/cache@v6
        with:
          path: .build/SourcePackages
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-27-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-27-

      - name: Run functional tests
        id: native_tests
        run: |
          set -o pipefail
          make "$FUNCTIONAL_TARGET" \
            VERIFIED_SIMULATOR_UDID="${{ steps.toolchain.outputs.simulator_udid }}" \
            VERIFIED_IPAD_SIMULATOR_UDID="${{ steps.toolchain.outputs.ipad_simulator_udid }}" \
            TEST_RESULTS_DIRECTORY="$TEST_RESULTS_DIRECTORY" \
            2>&1 | tee "$TEST_RESULTS_DIRECTORY/$FUNCTIONAL_TARGET.log"

      - name: Test destination resolver
        if: ${{ !cancelled() && matrix.lane == 'app' && (steps.native_tests.outcome == 'success' || steps.native_tests.outcome == 'failure') }}
        run: make destination-test

      - name: Upload functional test evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-${{ matrix.lane }}-evidence-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .build/TestResults/${{ matrix.lane }}
          if-no-files-found: warn
          include-hidden-files: true

  test:
    name: iOS tests
    if: ${{ always() }}
    needs:
      - functional-tests
    runs-on: ubuntu-latest
    steps:
      - name: Require every functional lane to succeed
        env:
          FUNCTIONAL_RESULT: ${{ needs.functional-tests.result }}
        run: |
          printf 'functional-tests matrix: %s\n' "$FUNCTIONAL_RESULT"
          if [[ "$FUNCTIONAL_RESULT" != success ]]; then
            echo "iOS tests requires the functional matrix conclusion to be success."
            exit 1
          fi
          echo "All four functional lane conclusions are success."

  # Visual snapshot qualification runs in its own job so its duration and result
  # are independent of the required iOS test aggregate. The committed 2x references
  # are the automated baseline for this comparison. A PNG mismatch, build error,
  # unavailable simulator destination, or timeout fails this job and the Tests
  # workflow. The job keeps its own timeout and preserves evidence for every
  # outcome.
  snapshot-qualification:
    name: Snapshot qualification (2x iPad)
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Reuse the Swift package checkout cache so this job does not clone
      # dependencies from scratch when it runs alongside the iPhone test job.
      - name: Verify toolchain and simulator
        id: destination
        run: make verify-snapshot-destination

      - name: Cache Swift package checkouts
        uses: actions/cache@v6
        with:
          path: .build/SourcePackages
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-27-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-27-

      # The step timeout stays below the job timeout so a hung test run is
      # stopped while the always() upload and summary steps can still execute.
      - name: Run 2x iPad snapshot tests
        id: snapshot_tests
        timeout-minutes: 45
        run: make test-snapshots VERIFIED_SIMULATOR_UDID="${{ steps.destination.outputs.simulator_udid }}" TEST_RESULTS_DIRECTORY="$GITHUB_WORKSPACE/.build/TestResults"

      - name: Upload 2x iPad snapshot evidence
        id: upload_evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2x-ipad-snapshot-evidence-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .build/TestResults
          if-no-files-found: warn

      # Report the observed step outcomes. A failed snapshot command does not
      # identify its cause: a reference mismatch, a build error, a simulator
      # problem, and a timeout all produce the same step outcome. This step does
      # not inspect result contents, so it does not label a failure as the 3x
      # reference mismatch. The upload step outcome is reported separately
      # because if-no-files-found is a warning and a successful upload step does
      # not prove that an artifact exists.
      - name: Report snapshot qualification status
        if: always()
        env:
          SNAPSHOT_OUTCOME: ${{ steps.snapshot_tests.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_evidence.outcome }}
        run: |
          snapshot_outcome="${SNAPSHOT_OUTCOME:-unavailable}"
          upload_outcome="${UPLOAD_OUTCOME:-unavailable}"

          case "$snapshot_outcome" in
            success)
              qualification_status="automated snapshot success; final owner visual approval pending"
              status_note="2x iPad snapshot command succeeded, and both schemes recorded a positive test count. The committed 2x references match the automated baseline; this is not final owner visual approval."
              ;;
            failure)
              qualification_status="failed"
              status_note="2x iPad snapshot command failed. Qualification failed and blocks the Tests workflow. The failure may be a snapshot reference mismatch, or it may be a build, simulator, or timeout error; this summary does not inspect the failure cause. Inspect the artifact if present, or the job log, before concluding that a reference mismatch occurred."
              ;;
            cancelled|skipped)
              qualification_status="did not complete"
              status_note="2x iPad snapshot command did not complete (outcome: $snapshot_outcome). Qualification did not complete. Inspect the artifact if present, or the job log, for partial evidence."
              ;;
            *)
              qualification_status="did not complete"
              status_note="2x iPad snapshot command outcome is unavailable or unrecognized (value: $snapshot_outcome). Qualification did not complete. Inspect the artifact if present, or the job log, for evidence."
              ;;
          esac

          case "$upload_outcome" in
            success)
              evidence_note="Artifact upload step succeeded. Inspect artifact 2x-ipad-snapshot-evidence-run-${{ github.run_id }}-attempt-${{ github.run_attempt }} if it exists; if-no-files-found: warn means the upload step can succeed without producing an artifact."
              ;;
            unavailable)
              evidence_note="Artifact upload outcome is unavailable, so this summary makes no claim that evidence was uploaded. Inspect the job log for preserved results."
              ;;
            *)
              evidence_note="Artifact upload step did not succeed (outcome: $upload_outcome), so evidence may be missing. Inspect the job log for preserved results."
              ;;
          esac

          echo "$status_note"
          case "$snapshot_outcome" in
            success) echo "::notice::$status_note" ;;
            *) echo "::warning::$status_note" ;;
          esac

          {
            echo "### Snapshot qualification (2x iPad)"
            echo
            echo "**Qualification status:** $qualification_status"
            echo
            echo "$status_note"
            echo
            echo "$evidence_note"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Qualification status | $qualification_status |"
            echo "| Command | \`make test-snapshots\` |"
            echo '| Destination | iPad Pro 11-inch (M5), iOS 27.2 (2x) |'
            echo "| Snapshot step outcome | $snapshot_outcome |"
            echo "| Artifact upload step outcome | $upload_outcome |"
            echo "| Blocking | Yes. A failed snapshot command fails this job and the Tests workflow. |"
            echo "| Evidence | Artifact \`2x-ipad-snapshot-evidence-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}\`, if the upload step succeeded and result files were found; otherwise inspect the job log. |"
            echo
            echo "Automated snapshot success confirms the committed 2x reference baseline. Final owner visual approval remains pending."
          } >> "$GITHUB_STEP_SUMMARY"

  native-snapshot-qualification:
    name: Native snapshot qualification (3x iPhone)
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify toolchain and simulator
        id: destination
        run: make verify-test-destination

      - name: Cache Swift package checkouts
        uses: actions/cache@v6
        with:
          path: .build/SourcePackages
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-27-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-27-

      - name: Run native 3x snapshot qualification
        timeout-minutes: 45
        run: make test-native-snapshots VERIFIED_SIMULATOR_UDID="${{ steps.destination.outputs.simulator_udid }}" TEST_RESULTS_DIRECTORY="$GITHUB_WORKSPACE/.build/NativeSnapshotResults"

      - name: Upload native 3x snapshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-3x-iphone-snapshot-evidence-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .build/NativeSnapshotResults
          if-no-files-found: warn
