name: Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: iOS tests
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test clean target
        run: make clean-test

      - name: Show toolchain
        id: toolchain
        run: |
          xcodebuild -version
          swift --version
          toolchain_id=$( { xcodebuild -version; swift --version | sed -n '1p'; } | shasum -a 256 | cut -c 1-16 )
          echo "Toolchain cache id: $toolchain_id"
          echo "id=$toolchain_id" >> "$GITHUB_OUTPUT"

      # Swift tooling bootstraps Mint packages under .tools/mint. Keep compiled
      # tools isolated by runner OS/architecture, exact Xcode/Swift toolchain,
      # and the swift-tooling release lock. Do not use restore-keys: a compiled
      # tool from a different toolchain must never be restored opportunistically.
      - name: Cache Mint tools
        uses: actions/cache@v6
        with:
          path: .tools/mint
          key: mint-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('Scripts/swift-tools.lock') }}

      - name: Bootstrap Swift tools
        run: make tools

      - name: Cache Swift package checkouts
        uses: actions/cache@v6
        with:
          path: .build/SourcePackages
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-27-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-27-

      - name: Run tests
        run: make test TEST_RESULTS_DIRECTORY="$GITHUB_WORKSPACE/.build/TestResults"

      # Preserve both iPhone result bundles for diagnosis. The upload is
      # advisory: a missing bundle is a warning and an upload failure must not
      # change the test step outcome or the blocking gate.
      - name: Upload iPhone test evidence
        id: upload_iphone_evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: iphone-test-evidence
          path: .build/TestResults
          if-no-files-found: warn

  # Visual snapshot qualification runs in its own job so its duration and result
  # are independent of the required iPhone test job. The committed 2x references
  # are the automated baseline for this comparison. A PNG mismatch, build error,
  # unavailable simulator destination, or timeout fails this job and the Tests
  # workflow. The job keeps its own timeout and preserves evidence for every
  # outcome.
  snapshot-qualification:
    name: Snapshot qualification (2x iPad)
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Reuse the Swift package checkout cache so this job does not clone
      # dependencies from scratch when it runs alongside the iPhone test job.
      - name: Cache Swift package checkouts
        uses: actions/cache@v6
        with:
          path: .build/SourcePackages
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-27-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-27-

      # The step timeout stays below the job timeout so a hung test run is
      # stopped while the always() upload and summary steps can still execute.
      - name: Run 2x iPad snapshot tests
        id: snapshot_tests
        timeout-minutes: 45
        run: make test-snapshots TEST_RESULTS_DIRECTORY="$GITHUB_WORKSPACE/.build/TestResults"

      - name: Upload 2x iPad snapshot evidence
        id: upload_evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2x-ipad-snapshot-evidence
          path: .build/TestResults
          if-no-files-found: warn

      # Report the observed step outcomes. A failed snapshot command does not
      # identify its cause: a reference mismatch, a build error, a simulator
      # problem, and a timeout all produce the same step outcome. This step does
      # not inspect result contents, so it does not label a failure as the 3x
      # reference mismatch. The upload step outcome is reported separately
      # because if-no-files-found is a warning and a successful upload step does
      # not prove that an artifact exists.
      - name: Report snapshot qualification status
        if: always()
        env:
          SNAPSHOT_OUTCOME: ${{ steps.snapshot_tests.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_evidence.outcome }}
        run: |
          snapshot_outcome="${SNAPSHOT_OUTCOME:-unavailable}"
          upload_outcome="${UPLOAD_OUTCOME:-unavailable}"

          case "$snapshot_outcome" in
            success)
              qualification_status="automated snapshot success; final owner visual approval pending"
              status_note="2x iPad snapshot command succeeded, and both schemes recorded a positive test count. The committed 2x references match the automated baseline; this is not final owner visual approval."
              ;;
            failure)
              qualification_status="failed"
              status_note="2x iPad snapshot command failed. Qualification failed and blocks the Tests workflow. The failure may be a snapshot reference mismatch, or it may be a build, simulator, or timeout error; this summary does not inspect the failure cause. Inspect the artifact if present, or the job log, before concluding that a reference mismatch occurred."
              ;;
            cancelled|skipped)
              qualification_status="did not complete"
              status_note="2x iPad snapshot command did not complete (outcome: $snapshot_outcome). Qualification did not complete. Inspect the artifact if present, or the job log, for partial evidence."
              ;;
            *)
              qualification_status="did not complete"
              status_note="2x iPad snapshot command outcome is unavailable or unrecognized (value: $snapshot_outcome). Qualification did not complete. Inspect the artifact if present, or the job log, for evidence."
              ;;
          esac

          case "$upload_outcome" in
            success)
              evidence_note="Artifact upload step succeeded. Inspect artifact 2x-ipad-snapshot-evidence if it exists; if-no-files-found: warn means the upload step can succeed without producing an artifact."
              ;;
            unavailable)
              evidence_note="Artifact upload outcome is unavailable, so this summary makes no claim that evidence was uploaded. Inspect the job log for preserved results."
              ;;
            *)
              evidence_note="Artifact upload step did not succeed (outcome: $upload_outcome), so evidence may be missing. Inspect the job log for preserved results."
              ;;
          esac

          echo "$status_note"
          case "$snapshot_outcome" in
            success) echo "::notice::$status_note" ;;
            *) echo "::warning::$status_note" ;;
          esac

          {
            echo "### Snapshot qualification (2x iPad)"
            echo
            echo "**Qualification status:** $qualification_status"
            echo
            echo "$status_note"
            echo
            echo "$evidence_note"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Qualification status | $qualification_status |"
            echo '| Command | `make test-snapshots` |'
            echo '| Destination | iPad Pro 11-inch (M5), iOS 27.0 (2x) |'
            echo "| Snapshot step outcome | $snapshot_outcome |"
            echo "| Artifact upload step outcome | $upload_outcome |"
            echo "| Blocking | Yes. A failed snapshot command fails this job and the Tests workflow. |"
            echo '| Evidence | Artifact `2x-ipad-snapshot-evidence`, if the upload step succeeded and result files were found; otherwise inspect the job log. |'
            echo
            echo "Automated snapshot success confirms the committed 2x reference baseline. Final owner visual approval remains pending."
          } >> "$GITHUB_STEP_SUMMARY"
