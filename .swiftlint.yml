# Repository-specific SwiftLint overlay. The shared swift-tooling release
# supplies the baseline rules and severities before this file is applied.

# Keep strictness explicit in the consumer overlay because SwiftLint is invoked
# with the shared baseline and this file as separate layered configurations.
# Every enabled rule violation must fail lint, regardless of its rule severity.
strict: true

# This project is Swift 6-only. Requiring @preconcurrency solely to preserve
# Swift 5 compatibility hides concurrency issues instead of fixing them.
disabled_rules:
  - incompatible_concurrency_annotation

# Repository-generated and build-system paths are not lint inputs.
excluded:
  - .build
  - "**/.build/**"
  - "**/.swiftpm/**"
  - "**/Generated/**"
  - "**/*.generated.swift"

# These rules require compiler-backed analysis and therefore remain consumer-
# owned. Scripts/run-swiftlint-analysis.sh supplies the compiler log.
analyzer_rules:
  - capture_variable
  - typesafe_array_init
  - unused_declaration
  - unused_import

unused_declaration:
  related_usrs_to_skip: []

unused_import:
  require_explicit_imports: true
  # Foundation re-exports the underscored Darwin implementation modules on Apple
  # platforms. A file that reaches their symbols through Foundation must reference the
  # public module instead of importing the implementation module directly.
  allowed_transitive_imports:
    - module: Foundation
      allowed_transitive_imports:
        - _DarwinFoundation1
        - _DarwinFoundation2
        - _DarwinFoundation3
  always_keep_imports: []
